<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nimbus — AI Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>💬</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />
</head>
<body>

  <!-- Ambient signature: a slow-drifting aurora field behind all glass panels -->
  <div class="aurora-field" aria-hidden="true">
    <span class="a1"></span>
    <span class="a2"></span>
    <span class="a3"></span>
  </div>

  <!-- ============ AUTH VIEW ============ -->
  <div id="auth-view" class="auth-view">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Nimbus</span>
      </div>
      <p class="auth-tagline">Your thoughts, answered.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="register">Sign up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
        </label>
        <p class="auth-error" id="login-error"></p>
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Name
          <input type="text" id="register-name" required autocomplete="name" placeholder="Ada Lovelace" />
        </label>
        <label>Email
          <input type="email" id="register-email" required autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>Password
          <input type="password" id="register-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
        </label>
        <p class="auth-error" id="register-error"></p>
        <button type="submit" class="btn-primary">Create account</button>
      </form>
    </div>
  </div>

  <!-- ============ APP VIEW ============ -->
  <div id="app-view" class="app-view hidden">
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand small">
          <span class="brand-mark">✦</span>
          <span class="brand-name">Nimbus</span>
        </div>
        <button class="icon-btn" id="close-sidebar-btn" aria-label="Close sidebar">✕</button>
      </div>

      <button class="new-chat-btn" id="new-chat-btn">
        <span class="plus">+</span> New chat
      </button>

      <div class="chat-list" id="chat-list">
        <!-- chat history items injected here -->
      </div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar avatar-user" id="user-avatar">U</span>
          <span class="user-name" id="user-name-label">User</span>
        </div>
        <div class="footer-actions">
          <button class="icon-btn" id="theme-toggle-btn" title="Toggle theme">◐</button>
          <button class="icon-btn" id="logout-btn" title="Log out">⏻</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="open-sidebar-btn" aria-label="Open sidebar">☰</button>
        <h1 class="chat-title" id="chat-title">New chat</h1>
        <div class="topbar-actions">
          <select id="provider-select" class="provider-select" title="AI provider (informational)">
            <option value="gemini">Gemini</option>
            <option value="openrouter">OpenRouter</option>
            <option value="groq">Groq</option>
          </select>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-mark">✦</div>
          <h2>What's on your mind?</h2>
          <p>Ask anything — Nimbus keeps context as you go.</p>
          <div class="suggestion-grid">
            <button class="suggestion-chip" data-prompt="Explain quantum computing like I'm 12.">Explain quantum computing simply</button>
            <button class="suggestion-chip" data-prompt="Write a short poem about autumn rain.">Write a short poem</button>
            <button class="suggestion-chip" data-prompt="Give me a healthy 3-day meal plan.">Plan a 3-day meal plan</button>
            <button class="suggestion-chip" data-prompt="Write a Python function to reverse a linked list, with comments.">Reverse a linked list in Python</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <form id="composer-form" class="composer-form">
          <textarea
            id="message-input"
            class="message-input"
            placeholder="Message Nimbus…"
            rows="1"
            maxlength="8000"
          ></textarea>
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
          </button>
        </form>
        <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
      </div>
    </main>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Markdown + syntax highlighting (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>

  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
