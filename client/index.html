<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus AI Chat</title>
  <meta name="description" content="A production-ready AI chatbot powered by free LLM providers.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%238b5cf6'/%3E%3Ctext x='50' y='58' font-size='48' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="aurora-field" aria-hidden="true">
    <span class="a1"></span>
    <span class="a2"></span>
    <span class="a3"></span>
  </div>

  <section id="auth-view" class="auth-view">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark">*</span>
        <span class="brand-name">Nimbus</span>
      </div>
      <p class="auth-tagline">your thoughts, answered.</p>

      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="auth-tab active" type="button" data-tab="login">Sign in</button>
        <button class="auth-tab" type="button" data-tab="register">Create account</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          Email
          <input id="login-email" type="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="auth-error" aria-live="polite"></p>
        <button class="btn-primary" type="submit">Sign in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>
          Name
          <input id="register-name" type="text" autocomplete="name" required>
        </label>
        <label>
          Email
          <input id="register-email" type="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input id="register-password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p id="register-error" class="auth-error" aria-live="polite"></p>
        <button class="btn-primary" type="submit">Create account</button>
      </form>
    </div>
  </section>

  <section id="app-view" class="app-view hidden">
    <aside id="sidebar" class="sidebar" aria-label="Chat history">
      <div class="sidebar-header">
        <div class="brand small">
          <span class="brand-mark">*</span>
          <span class="brand-name">Nimbus</span>
        </div>
        <button id="close-sidebar-btn" class="icon-btn" type="button" title="Close sidebar" aria-label="Close sidebar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <span class="plus" aria-hidden="true">+</span>
        <span>New chat</span>
      </button>

      <div id="chat-list" class="chat-list" aria-label="Conversations"></div>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span id="user-avatar" class="avatar avatar-user">U</span>
          <span id="user-name-label" class="user-name">User</span>
        </div>
        <div class="footer-actions">
          <button id="theme-toggle-btn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </button>
          <button id="logout-btn" class="icon-btn" type="button" title="Sign out" aria-label="Sign out">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <path d="m16 17 5-5-5-5"></path>
              <path d="M21 12H9"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div id="mobile-overlay" class="mobile-overlay"></div>

    <main class="main">
      <header class="topbar">
        <button id="open-sidebar-btn" class="icon-btn only-mobile" type="button" title="Open sidebar" aria-label="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 18h16"></path>
          </svg>
        </button>
        <h1 id="chat-title" class="chat-title">New chat</h1>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <span class="empty-mark" aria-hidden="true">*</span>
          <h2>Good <span id="heroTimeOfDay">day</span>, Ashu.</h2>
          <p>What would you like to think through today?</p>
          <div class="suggestion-grid">
            <button class="suggestion-chip" type="button" data-prompt="Explain this project structure and how the frontend talks to the backend.">Explain this project</button>
            <button class="suggestion-chip" type="button" data-prompt="Help me write a clean README for this AI chatbot.">Draft a README</button>
            <button class="suggestion-chip" type="button" data-prompt="Review my code for bugs and security issues.">Review the code</button>
            <button class="suggestion-chip" type="button" data-prompt="Suggest UI improvements for this chatbot.">Improve the UI</button>
          </div>
        </div>
      </section>

      <footer class="composer">
        <form id="composer-form" class="composer-form">
          <textarea id="message-input" class="message-input" rows="1" placeholder="Ask anything..." autocomplete="off"></textarea>
          <button id="send-btn" class="send-btn" type="submit" title="Send message" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 2 11 13"></path>
              <path d="m22 2-7 20-4-9-9-4Z"></path>
            </svg>
          </button>
        </form>
        <p class="composer-hint">AI can make mistakes. Check important information.</p>
      </footer>
    </main>
  </section>

  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
  <script src="js/greeting.js"></script>
</body>
</html>
